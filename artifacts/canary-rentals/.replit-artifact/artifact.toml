kind = "web"
  previewPath = "/"
  title = "Canary Islands Rental Manager"
  version = "1.0.0"
  id = "artifacts/canary-rentals"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/", "/api", "/__clerk" ]
  localPort = 22860

  [services.development]
  run = "pnpm --filter @workspace/canary-rentals run dev"

  [services.env]
  PORT = "22860"
  BASE_PATH = "/"

  [services.production]
  run = "NODE_ENV=production node --enable-source-maps artifacts/api-server/dist/index.mjs"
  build = "sh -c 'NODE_ENV=production BASE_PATH=/ PORT=8080 pnpm --filter @workspace/canary-rentals run build && pnpm --filter @workspace/api-server run build'"

  [services.production.health.startup]
  path = "/api/healthz"
